name: Deploy archive

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [archive-published, archive-harvested]
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Allow the catalogue to shrink for a planned withdrawal
        type: boolean
        default: false
  # The host publishes every 15 minutes, so the site checks as often and rebuilds only when the dataset has changed.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: archive-pages
  cancel-in-progress: false

jobs:
  changed:
    # Nothing is deployed until the public dataset is named, so pushes before the first upload only run the tests.
    if: github.ref_name == github.event.repository.default_branch && vars.HF_DATASET_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages
      - name: Compare the dataset with the revision the site serves
        id: compare
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          live=$(curl --silent --show-error --fail --location --retry 2 --max-time 30 \
            --header 'Cache-Control: no-cache' "${PAGES_URL%/}/sources.json" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["dataset"][0])' || true)
          latest=$(curl --silent --show-error --fail --retry 2 --max-time 30 \
            "https://huggingface.co/api/datasets/$HF_DATASET_REPO" |
            python3 -c 'import json, sys; data = json.load(sys.stdin); print("https://huggingface.co/datasets/{id}/resolve/{sha}/".format(**data))')
          echo "The site serves ${live:-nothing yet}; the latest dataset URL is $latest."
          if [ "$live" = "$latest" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      - run: node scripts/check.mjs
        env:
          PYTHON: python
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages
      - name: Load the live document counts
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          status=$(curl --silent --show-error --location --retry 2 --max-time 30 \
            --output "$RUNNER_TEMP/archive-current.json" --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' "${PAGES_URL%/}/data/current.json")
          case "$status" in
            200)
              mkdir -p out/site/data
              cp "$RUNNER_TEMP/archive-current.json" out/site/data/current.json
              ;;
            404) ;;
            *) echo "Could not read the live archive counts (HTTP $status)." >&2; exit 1 ;;
          esac
      - name: Build the public site
        shell: bash
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink }}
        run: |
          : "${HF_DATASET_REPO:?Set the HF_DATASET_REPO repository variable to the public Hugging Face dataset ID}"
          options=()
          if [ "$ALLOW_SHRINK" = "true" ]; then options+=(--allow-shrink); fi
          python builder/build.py --hf-repo "$HF_DATASET_REPO" --dataset out/hf-cache --out out/site \
            --previous-site "$PAGES_URL" "${options[@]}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
